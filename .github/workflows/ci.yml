name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ROS_DISTRO: humble
      WS_DIR: ws
      TARGET_PACKAGE: fanuc_er4ia_moveit_config

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v6
        with:
          path: ws/src/fanuc_er4ia_moveit_config

      - name: Checkout FANUC description packages
        uses: actions/checkout@v6
        with:
          repository: FANUC-CORPORATION/fanuc_description
          ref: main
          path: deps/fanuc_description

      - name: Checkout FANUC driver packages
        uses: actions/checkout@v6
        with:
          repository: FANUC-CORPORATION/fanuc_driver
          ref: humble
          path: deps/fanuc_driver

      - name: Setup ROS 2 Humble
        uses: ros-tooling/setup-ros@0.7.18
        with:
          required-ros-distributions: humble

      - name: Install rosdep dependencies
        run: |
          cd "${WS_DIR}"
          rosdep update
          rosdep install \
            --from-paths src/fanuc_er4ia_moveit_config \
            --ignore-src \
            -r -y \
            --rosdistro "${ROS_DISTRO}" \
            --skip-keys="warehouse_ros_mongo fanuc_hardware_interface fanuc_lrmate_description fanuc_controllers fanuc_moveit_config"

      - name: Build MoveIt configuration package
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          cd "${WS_DIR}"
          colcon build \
            --symlink-install \
            --packages-select "${TARGET_PACKAGE}" \
            --event-handlers console_direct+

      - name: Verify Python launch syntax
        run: |
          cd "${WS_DIR}/src/${TARGET_PACKAGE}"
          python3 -m compileall -q launch

      - name: Validate URDF, SRDF, manifests, and launch descriptions
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source "${WS_DIR}/install/setup.bash"

          export ROS_LOG_DIR=/tmp/roslog
          mkdir -p "${ROS_LOG_DIR}"

          # The two FANUC repositories are intentionally not built in CI.
          # Their source trees are enough for xacro/launch validation, so expose
          # them through temporary ament-index entries.
          MOCK_PREFIX="${GITHUB_WORKSPACE}/${WS_DIR}/mock_prefix"
          mkdir -p "${MOCK_PREFIX}/share/ament_index/resource_index/packages"

          for package in fanuc_lrmate_description fanuc_hardware_interface; do
            touch "${MOCK_PREFIX}/share/ament_index/resource_index/packages/${package}"
          done

          ln -sfn \
            "${GITHUB_WORKSPACE}/deps/fanuc_description/fanuc_lrmate_description" \
            "${MOCK_PREFIX}/share/fanuc_lrmate_description"
          ln -sfn \
            "${GITHUB_WORKSPACE}/deps/fanuc_driver/fanuc_hardware_interface" \
            "${MOCK_PREFIX}/share/fanuc_hardware_interface"

          export AMENT_PREFIX_PATH="${MOCK_PREFIX}:${AMENT_PREFIX_PATH}"

          test -f "${WS_DIR}/build/${TARGET_PACKAGE}/ament_cmake_core/package.cmake"
          test -f "${WS_DIR}/src/${TARGET_PACKAGE}/package.xml"

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          package_dir = Path("ws/src/fanuc_er4ia_moveit_config")
          ET.parse(package_dir / "package.xml")
          ET.parse(package_dir / "config" / "er4ia.srdf")
          print("Package XML and SRDF parsed successfully")
          PY

          xacro \
            "${WS_DIR}/src/${TARGET_PACKAGE}/config/er4ia.urdf.xacro" \
            > /tmp/er4ia.urdf

          check_urdf /tmp/er4ia.urdf

          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          launch_dir = Path("ws/src/fanuc_er4ia_moveit_config/launch")
          for launch_file in sorted(launch_dir.glob("*.launch.py")):
              spec = importlib.util.spec_from_file_location(launch_file.stem, launch_file)
              module = importlib.util.module_from_spec(spec)
              assert spec.loader is not None
              spec.loader.exec_module(module)
              description = module.generate_launch_description()
              assert description is not None
              print(f"OK: {launch_file.name}")
          PY
